name: Verify workspace container

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-workspace-container.yml'
      - '.dockerignore'
      - 'deploy/workspace/**'
      - 'backend/**'
      - 'front/**'
      - 'scripts/verify_workspace_container.py'
      - 'scripts/tests/test_workspace_container_verifier.py'
  pull_request:
    paths:
      - '.github/workflows/verify-workspace-container.yml'
      - '.dockerignore'
      - 'deploy/workspace/**'
      - 'backend/**'
      - 'front/**'
      - 'scripts/verify_workspace_container.py'
      - 'scripts/tests/test_workspace_container_verifier.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fawnimo-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-container:
    if: github.repository == 'weicaojava/fawnimo'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: fawnimo-container-check:${{ github.sha }}
      RUN_PREFIX: fawnimo-check-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local-engine and cleanup refusal guards
        run: python -m unittest discover -s scripts/tests -p test_workspace_container_verifier.py -v
      - name: Build the actual same-origin workspace image without publishing
        run: docker build --file deploy/workspace/Dockerfile --tag "$IMAGE" .
      - name: Verify Compose runtime, private accounts and persistent reconstruction
        run: python scripts/verify_workspace_container.py --image "$IMAGE" --run-prefix "$RUN_PREFIX" --report container-verification.json
      - name: Retain the bounded qualification result without fixture credentials or media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-container-${{ github.sha }}
          path: container-verification.json
          if-no-files-found: ignore
          retention-days: 14
