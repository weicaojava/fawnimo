name: Verify Fawnimo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fawnimo-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  register-and-backend:
    if: github.repository == 'weicaojava/fawnimo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JELLYFISH_SKIP_ENV_FILE: "1"
      PYTHONUTF8: "1"
      UV_PYTHON_DOWNLOADS: never
      FAWNIMO_TEST_FFMPEG: /usr/bin/ffmpeg
      TEST_MEDIA_PROBE: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked backend and test dependencies
        run: |
          python -m pip install uv==0.13.6
          cd backend
          uv sync --frozen --extra dev
      - name: Check feature references and generated views
        run: |
          backend/.venv/bin/python scripts/features.py --check
          backend/.venv/bin/python scripts/features_check.py
      - name: Install the trusted local media decoder
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Verify isolated identities, workspaces and examples
        working-directory: backend
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_identity_controlplane.py tests/test_identity_review.py
          tests/test_workspace_boundary.py tests/test_workspace_demo.py
          tests/test_project_discovery.py tests/test_file_ranges.py
          tests/test_workspace_launcher.py tests/test_response_commit_order.py
          tests/test_project_budget.py tests/test_execution_budget.py
          tests/test_workspace_migration.py
          tests/test_workspace_resource_matrix.py
          tests/test_workspace_video_runtime.py tests/test_execution_admission.py
          tests/test_execution_api.py tests/test_execution_accounting.py
          tests/test_connection_versions.py tests/test_model_charges.py
          tests/test_model_prices.py tests/test_model_billing.py
          tests/test_model_billing_budget_view.py tests/test_model_billing_cli.py
          tests/test_model_accounting_guards.py
          tests/test_agent_execution.py tests/test_asset_image_generation.py
          tests/test_model_job_charges.py tests/test_agent_project_accounting.py
          tests/test_image_project_accounting.py tests/test_cross_model_project_budget.py
          tests/test_model_price_workspace.py tests/test_gateway_pricing_status.py
          tests/test_quote_model_identity.py
          tests/test_understanding_model_connections.py tests/test_understanding_charges.py
          tests/test_video_understanding.py tests/test_understanding_runtime_charges.py
          tests/test_trusted_http.py tests/test_llm_manage.py
          tests/test_llm_resolver.py tests/test_llm_api_responses.py
          tests/test_native_video_model_connections.py
          tests/test_native_video_project_accounting.py tests/test_native_video_planned_accounting.py
          tests/test_native_video_http_accounting.py tests/test_native_video_cancellation.py tests/test_native_video_api.py
          tests/test_durable_execution.py tests/test_execution_schema.py
          tests/test_execution_dispatcher.py tests/test_execution_runtime.py
          tests/test_execution_artifacts.py tests/test_execution_http_integration.py
          tests/test_shot_plan.py tests/test_shot_plan_acceptance.py tests/test_shot_plan_guard_acceptance.py
          tests/test_seedance25_independent.py tests/test_workspace_video_pipeline.py

  frontend:
    if: github.repository == 'weicaojava/fawnimo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned package manager and locked frontend dependencies
        working-directory: front
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Check types and build the same-origin studio
        working-directory: front
        env:
          VITE_BACKEND_URL: ""
        run: pnpm run build
